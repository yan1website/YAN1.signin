<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YAN1 - Sign In</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #173b78 0%,
                    transparent 45%
                ),
                radial-gradient(
                    circle at bottom right,
                    #42176f 0%,
                    transparent 45%
                ),
                #05070d;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 420px;

            padding: 40px 25px;

            text-align: center;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);
        }

        h1 {
            margin: 0 0 10px;

            font-size: 42px;

            letter-spacing: 8px;
        }

        p {
            color: #bfc5d2;

            margin-bottom: 30px;
        }

        #googleSignIn {
            display: flex;

            justify-content: center;

            min-height: 44px;
        }

        #status {
            margin-top: 20px;

            font-size: 14px;

            color: #bfc5d2;

            word-break: break-word;

            line-height: 1.5;
        }

        .error {
            color: #ff7777 !important;
        }

        #openSection {
            display: none;

            margin-top: 25px;
        }

        #openButton {
            display: inline-block;

            padding: 13px 25px;

            border-radius: 10px;

            background: white;

            color: #111;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #openButton:hover {
            transform: scale(1.03);
        }

        #generatedLink {
            margin-top: 15px;

            padding: 10px;

            border-radius: 8px;

            background: rgba(0, 0, 0, 0.25);

            color: #9da8ba;

            font-size: 11px;

            word-break: break-all;

            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>YAN1</h1>

    <p>Sign in with your Google account</p>

    <div id="googleSignIn"></div>

    <div id="status"></div>

    <!-- ========================================================
         OPEN BUTTON
         ========================================================= -->

    <div id="openSection">

        <a
            id="openButton"
            href="#"
        >
            Open in YAN1 App
        </a>

        <div id="generatedLink"></div>

    </div>

</div>


<script>

    // ============================================================
    // GOOGLE CLIENT ID
    // ============================================================

    const CLIENT_ID =
        "367502539128-4bc3ohihpe4ithrdcde53tbcv4mj0nv7.apps.googleusercontent.com";


    // ============================================================
    // DESTINATION
    // ============================================================

    /*
     * The final URL will become:

     * https://yan1website.github.io/YAN1.signin/index2.html?access_token=ACCESS_TOKEN_HERE
     *
     * where ACCESS_TOKEN_HERE is automatically replaced with the
     * actual Google access token.
     */

    const DESTINATION =
        "https://yan1website.github.io/YAN1.signin/index2.html";


    // ============================================================
    // GOOGLE TOKEN CLIENT
    // ============================================================

    let tokenClient;


    // ============================================================
    // INITIALIZE GOOGLE
    // ============================================================

    function initializeGoogle() {

        tokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: "openid email profile",

                callback: handleGoogleResponse

            });


        // ========================================================
        // CREATE SIGN-IN BUTTON
        // ========================================================

        const button =
            document.createElement("button");

        button.textContent =
            "Sign in with Google";

        button.style.padding =
            "12px 24px";

        button.style.border =
            "none";

        button.style.borderRadius =
            "8px";

        button.style.background =
            "white";

        button.style.color =
            "#222";

        button.style.fontSize =
            "16px";

        button.style.fontWeight =
            "600";

        button.style.cursor =
            "pointer";


        button.onclick = function () {

            document.getElementById("status").textContent =
                "Opening Google sign-in...";


            // Request Google access token

            tokenClient.requestAccessToken({

                prompt: "consent"

            });

        };


        document
            .getElementById("googleSignIn")
            .appendChild(button);
    }


    // ============================================================
    // GOOGLE RESPONSE
    // ============================================================

    function handleGoogleResponse(response) {

        // ========================================================
        // GOOGLE ERROR
        // ========================================================

        if (response.error) {

            console.error(
                "Google OAuth error:",
                response
            );

            document.getElementById("status").textContent =
                "Google sign-in failed.";

            document
                .getElementById("status")
                .classList.add("error");

            return;
        }


        // ========================================================
        // GET ACCESS TOKEN
        // ========================================================

        const accessToken =
            response.access_token;


        if (!accessToken) {

            document.getElementById("status").textContent =
                "No access token was received.";

            document
                .getElementById("status")
                .classList.add("error");

            return;
        }


        console.log(
            "Google access token received."
        );


        // ========================================================
        // CREATE DESTINATION URL
        // ========================================================

        /*
         * Example final result:

         * https://yan1website.github.io/YAN1.signin/index2.html
         * ?access_token=ACCESS_TOKEN_HERE
         */

        const generatedLink =
            DESTINATION +
            "?access_token=" +
            encodeURIComponent(accessToken);


        console.log(
            "Generated YAN1 URL:",
            generatedLink
        );


        // ========================================================
        // SHOW OPEN BUTTON
        // ========================================================

        document.getElementById("status").textContent =
            "Google sign-in successful. Click below to continue.";


        document.getElementById("openSection")
            .style.display = "block";


        // ========================================================
        // SET BUTTON URL
        // ========================================================

        const openButton =
            document.getElementById("openButton");


        openButton.href =
            generatedLink;


        /*
         * Do NOT automatically redirect.
         *
         * The user must click the button.
         */


        // ========================================================
        // SHOW GENERATED URL
        // ========================================================

        document.getElementById("generatedLink")
            .textContent =
                generatedLink;
    }


    // ============================================================
    // WAIT FOR GOOGLE LIBRARY
    // ============================================================

    window.onload = function () {

        const checkGoogle =
            setInterval(function () {

                if (
                    window.google &&
                    google.accounts &&
                    google.accounts.oauth2
                ) {

                    clearInterval(checkGoogle);

                    initializeGoogle();
                }

            }, 100);

    };

</script>

</body>
</html>
