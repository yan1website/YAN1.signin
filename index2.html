<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YAN1 - Google Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #173b78 0%,
                    transparent 45%
                ),
                radial-gradient(
                    circle at bottom right,
                    #42176f 0%,
                    transparent 45%
                ),
                #05070d;

            color: white;
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;

            backdrop-filter: blur(18px);
        }

        h1 {
            margin-top: 0;
            letter-spacing: 5px;
        }

        #loading {
            color: #c9c9c9;
        }

        #profile {
            display: none;
        }

        .profile-image {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .email {
            font-size: 16px;
            color: #c8d0df;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .info {
            text-align: left;
            background: rgba(0,0,0,0.20);
            border-radius: 14px;
            padding: 18px;
        }

        .row {
            padding: 9px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #9da8ba;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .value {
            color: white;
            word-break: break-word;
        }

        #error {
            display: none;
            color: #ff7777;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>YAN1</h1>

    <div id="loading">
        Getting Google account information...
    </div>

    <div id="error"></div>

    <div id="profile">

        <img
            id="profilePicture"
            class="profile-image"
            alt="Google Profile Picture"
        >

        <div id="name" class="name"></div>

        <div id="email" class="email"></div>

        <div class="info">

            <div class="row">
                <div class="label">Google ID</div>
                <div id="googleId" class="value"></div>
            </div>

            <div class="row">
                <div class="label">First Name</div>
                <div id="firstName" class="value"></div>
            </div>

            <div class="row">
                <div class="label">Last Name</div>
                <div id="lastName" class="value"></div>
            </div>

            <div class="row">
                <div class="label">Email Verified</div>
                <div id="emailVerified" class="value"></div>
            </div>

            <div class="row">
                <div class="label">Locale</div>
                <div id="locale" class="value"></div>
            </div>

        </div>

    </div>

</div>


<script>

    // ============================================================
    // 1. GET ACCESS TOKEN FROM URL
    // ============================================================

    const urlParams = new URLSearchParams(window.location.search);

    const accessToken = urlParams.get("access_token");


    // ============================================================
    // 2. CHECK WHETHER TOKEN EXISTS
    // ============================================================

    if (!accessToken) {

        showError(
            "No Google access token was found in the URL."
        );

    } else {

        console.log("Access token received.");

        getGoogleUserInfo(accessToken);
    }


    // ============================================================
    // 3. SEND ACCESS TOKEN TO GOOGLE
    // ============================================================

    async function getGoogleUserInfo(token) {

        try {

            const response = await fetch(
                "https://openidconnect.googleapis.com/v1/userinfo",
                {
                    method: "GET",

                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );


            // ====================================================
            // CHECK GOOGLE RESPONSE
            // ====================================================

            if (!response.ok) {

                const errorText = await response.text();

                console.error(
                    "Google returned an error:",
                    errorText
                );

                throw new Error(
                    "Google rejected the access token."
                );
            }


            // ====================================================
            // GET USER INFORMATION
            // ====================================================

            const user = await response.json();

            console.log("Google User Information:");
            console.log(user);


            // ====================================================
            // DISPLAY INFORMATION
            // ====================================================

            displayUser(user);


        } catch (error) {

            console.error(error);

            showError(
                "Unable to retrieve your Google account information."
            );
        }
    }


    // ============================================================
    // 4. DISPLAY USER INFORMATION
    // ============================================================

    function displayUser(user) {

        document.getElementById("loading").style.display = "none";

        document.getElementById("profile").style.display = "block";


        // Profile picture
        if (user.picture) {

            document.getElementById("profilePicture").src =
                user.picture;

        } else {

            document.getElementById("profilePicture").style.display =
                "none";
        }


        // Name
        document.getElementById("name").textContent =
            user.name || "Google User";


        // Email
        document.getElementById("email").textContent =
            user.email || "No email available";


        // Google ID
        document.getElementById("googleId").textContent =
            user.sub || "Not available";


        // First name
        document.getElementById("firstName").textContent =
            user.given_name || "Not available";


        // Last name
        document.getElementById("lastName").textContent =
            user.family_name || "Not available";


        // Email verification
        document.getElementById("emailVerified").textContent =
            user.email_verified === true
                ? "Yes"
                : "No";


        // Locale
        document.getElementById("locale").textContent =
            user.locale || "Not available";
    }


    // ============================================================
    // 5. ERROR DISPLAY
    // ============================================================

    function showError(message) {

        document.getElementById("loading").style.display = "none";

        const error = document.getElementById("error");

        error.textContent = message;

        error.style.display = "block";
    }

</script>

</body>
</html>
